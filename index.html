  <title>Jeu Loup-Garou 🐺</title>

  <style>
    body { background: #eee; font-family: Arial,sans-serif; margin:0; padding:0;}
    h1 { text-align: center; font-size: 2em; margin: 18px 0 12px 0; }
    .centered { display: flex; flex-direction: column; align-items: center; }
    .hidden { display: none !important; }
 .players-row, .narrateur-choix-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px; /* avant c'était 9px : bulles plus proches */
  padding: 0 1.5vw;   /* ✅ réduit les marges latérales à 1.5% de la largeur de l’écran */
  margin: 8px auto;   /* marge verticale plus compacte */
  max-width: 100vw;
  box-sizing: border-box;
}

.player-mini, .narrateur-mini {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 0 0 calc(20% - 4px); /* avant 25% → 5 bulles par ligne au lieu de 4 */
  max-width: calc(20% - 4px);
  box-sizing: border-box;
}
@media (max-width: 700px) {
  .player-mini, .narrateur-mini {
    flex: 0 0 calc(20% - 4px);
    max-width: calc(20% - 4px);
  }
}


.player-avatar, .narrateur-avatar {
  width: 80px;               /* ✅ largeur de la bulle (augmente ici) */
  height: 80px;              /* ✅ hauteur égale pour garder la forme carrée */
  border-radius: 12px;       /* ✅ arrondis plus doux */
  object-fit: cover;
  border: 3px solid #44d344; /* ✅ bordure un peu plus visible */
  background: #e4e4e4;
  margin-bottom: 5px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15); /* ✅ petite ombre élégante */
  transition: transform 0.15s ease, border 0.15s, filter 0.18s;
}

/* Petit effet au survol */
.player-avatar:hover {
  transform: scale(1.05);
}


 .player-avatar.elim {
  border: 3px solid #ff1a1a !important;        /* Rouge plus vif */
  box-shadow: 0 0 10px 2px rgba(255, 0, 0, 0.6); /* 💥 halo lumineux rouge */
  filter: grayscale(0.8) brightness(0.6) contrast(1.3); /* un peu plus clair */
  opacity: 0.55;                              /* image un peu visible */
  transition: all 0.3s ease;
}


    .player-name, .narrateur-name {
      font-size: .94em; font-weight: bold; text-align: center; margin-bottom: 0px; color: #1a1a1a; margin-top:0;
      width:100%; word-break: break-word; line-height:1.07;
    }
    .role-view {
      font-size:.92em;font-style:italic;cursor:pointer;padding:2px 0 2px 0; text-align:center; width: 100%;
      line-height:1.11;
    }
    .role-view:hover { background:#f6f6f6bb; border-radius:4px; }
    .role-select {


      width: 92%; font-size: .99em; margin-top: 1px; margin-bottom: 2px;
      border-radius: 4px; border:1px solid #ccc; background:#fafbfc;
      text-align: center; padding: 1px 0;
      display: block; margin-left: auto; margin-right: auto;
    }
    .remove-link { color:#c00;font-size:.81em;cursor:pointer; margin-top: 2px;}
    .remove-link:hover{text-decoration:underline;}
    .narrateur-mini.selected .narrateur-avatar { border:2.5px solid #32c852; }
    .narrateur-mini.selected { background: #eafbf4; border-radius: 12px;}
    .controls { display:flex; gap:11px; justify-content:center; margin: 12px 0; }
    input[type="file"] { display: none; }
    .narration-bar {
      display: flex; flex-direction:column; align-items: center; justify-content: center;
      margin: 9px auto 11px auto; padding: 12px 3vw 15px 3vw;
      background: #fff9; border-radius: 16px; box-shadow: 0 3px 11px #0001;
      font-size: 1.08em; font-weight: 500;
      min-width: 90vw; max-width: 98vw; width: 97vw;
      color: #222; min-height:36px;
    }
    .narr-text-content {
      width: 100%; text-align: center; white-space: pre-line; margin-bottom: 20px; line-height: 1.29;
      font-size: 1.09em; word-break:break-word; overflow-wrap:break-word;
      padding-left:3px;padding-right:3px;
    }
    .narr-btn-row {
      display: flex; gap: 18px; justify-content: center; width: 100%; margin-top: 3px;
    }
    .narr-btn {
      background: #eee; border-radius: 11px; border: 1px solid #bbb;
      padding: 10px 22px; margin: 0 6px; cursor: pointer; font-size:1em;
      transition: background .12s; font-weight: 600;
      box-shadow: 0 2px 7px #0001;
    }
    .narr-btn:active { background: #c8f4ff; }
    .narr-btn:hover { background: #d6f1ff; }
    /* Boutons sons sous le texte */
    .sound-grid {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      max-width: 97vw; margin: 10px auto 2px auto;
    }
    .sound-card {
      width: 96px; min-height: 36px; background: #fff; border-radius: 12px; box-shadow: 0 2px 7px #0001;
      padding: 11px 6px; display: flex; flex-direction: column; align-items: center; justify-content:center;
      cursor: pointer; transition: box-shadow .2s; border: 2px solid transparent;
      font-size: 1.02em; font-weight: 600; text-align:center; user-select: none;
    }
    .sound-card.active { box-shadow: 0 4px 12px #2a4; border: 2px solid #32c852; background: #f2fff5; }
    .sound-name { font-size: 1em; text-align: center; word-break: break-word; font-weight: 600; }
    @media (max-width:600px) {
      h1 { font-size: 1em; }
      .player-mini, .narrateur-mini { width: 48px; }
      .player-avatar, .narrateur-avatar { width: 34px; height:34px; }
      .narration-bar { font-size: .99em; min-width: 98vw; }
      .sound-card { width: 78px; min-height:26px; font-size:.92em;}
      .narr-btn { font-size: .96em; padding: 7px 4vw; }
    }
 .role-view {

/* Bouton de choix du rôle pour la voyante */
#roleChoiceContainer {
  display: flex;

  margin: 12px auto;
}

.role-choice-btn {
  background: #f8f8f8;

  border-radius: 10px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 1.05em;
  transition: background 0.15s, transform 0.15s;
  box-shadow: 0 2px 6px #0002;
}

.role-choice-btn:hover {
  background: #e7f5ff;
  transform: scale(1.05);
}

/* 🃏 Carte plein écran */
#roleCardOverlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.9);
  display: none;                 /* par défaut invisible */
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 9999;
}

#roleCardOverlay.active {        /* <-- visible quand la classe active est présente */
  display: flex !important;
}

.role-card-content {
  text-align: center;
  color: #fff;
  font-size: 1.3em;
  animation: fadeIn 0.3s ease;
}

#roleCardImage {
  max-width: 85vw;
  max-height: 70vh;
  border-radius: 12px;
  box-shadow: 0 0 20px #fff3;
  margin-bottom: 12px;
}

#roleCardName {
  font-weight: bold;
  font-size: 1.4em;
  color: #fff;
  text-shadow: 0 0 5px #000;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.97); }
  to { opacity: 1; transform: scale(1); }
}

/* Overlay plein écran */
#roleCardOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;                 /* caché par défaut */
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 9999;
}
#roleCardOverlay.active { display: flex !important; }

/* Contenu (image + nom) */
.role-card-content { text-align: center; color: #fff; }
#roleCardImage {
  max-width: 85vw;
  max-height: 70vh;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(255,255,255,.25);
  margin-bottom: 12px;
}
#roleCardName {
  font-weight: bold;
  font-size: 1.3em;
  text-shadow: 0 0 5px #000;
}

/* ❌ Bouton croix */
#roleCardClose {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  color: #fff;
  font-size: 28px;
  line-height: 42px;
  text-align: center;
  cursor: pointer;
  z-index: 10000;
  -webkit-tap-highlight-color: transparent;
}
#roleCardClose:hover { background: rgba(255,255,255,0.2); }
#roleCardClose:active { background: rgba(255,255,255,0.28); }

#muteButton {
  position: fixed;
  top: 12px;
  right: 14px;
  z-index: 9999;
  font-size: 1.5em;
  background: #fff;
  border: 2px solid #bbb;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  transition: all 0.2s ease;
}
#muteButton:hover {
  background: #eee;
  transform: scale(1.08);
}
#muteButton.muted {
  color: #b00020;
  background: #fdfdfd;
  border-color: #b00020;
}
/* 💘 Icône cœur sur les amoureux — SVG contrôlé */
.heart-icon {
  display: inline-flex;

}

.heart-icon.active svg { fill: #e31b23; } /* rouge quand actif */
.heart-icon:active { transform: scale(1.15); }

    const idx = Number(icon.dataset.idx);

    const newState = !joueurs[idx].amoureux;
    joueurs[idx].amoureux = newState;
    savePlayers();

    icon.classList.toggle("active", newState);
  });

  row.querySelectorAll(".role-view").forEach(div => {

  row.querySelectorAll(".role-select").forEach(sel => {

      savePlayers();
      renderSonsJoueurs();
    };
    sel.onblur = function() {
      renderSonsJoueurs();
    };
  });

  // 🔁 Synchronise les cœurs à l’état actuel
  row.querySelectorAll(".heart-icon").forEach(icon => {
    const idx = Number(icon.dataset.idx);
    icon.classList.toggle("active", !!joueurs[idx]?.amoureux);
  });
}

// ✅ Gestion du cycle et de la sauvegarde des index par son
let soundPlayIndex = JSON.parse(localStorage.getItem("soundPlayIndex") || "{}");

function renderSons() {
  const grid = document.getElementById('soundGrid');
  grid.innerHTML = "";
  audioObjs = [];

  sounds.forEach((s) => {
    const audios = s.musiques.map(src => {
      const audio = document.createElement('audio');
      audio.src = src;
      audio.preload = "auto";
      document.body.appendChild(audio);
      return audio;
    });

    audioObjs.push(...audios);

    // 🧠 index courant pour ce son (persiste entre les parties)
    if (soundPlayIndex[s.nom] === undefined) soundPlayIndex[s.nom] = 0;
    s.playIdx = soundPlayIndex[s.nom];
    s.state = 'stopped';

    // 🎵 Ajout emoji automatique selon le nom
    function getSoundEmoji(nom) {
      nom = nom.toLowerCase();
      if (nom.includes("dague")) return "🗡️";
	  if (nom.includes("potion soin")) return "🧪";
	  if (nom.includes("potion poison")) return "☠️";
	  if (nom.includes("ancien")) return "🧓";
	  if (nom.includes("petite fille")) return "👧";
	  if (nom.includes("chrono")) return "⏰";
	  if (nom.includes("rendez les bijoux")) return "💎";
      if (nom.includes("maire")) return "🇲🇫";
      if (nom.includes("applaud")) return "👏";
	  if (nom.includes("fusil")) return "💥";
	  if (nom.includes("siffle")) return "😙";
	  if (nom.includes("miss france")) return "💃";
	  if (nom.includes("bisous")) return "💋";
	  if (nom.includes("vote")) return "🗳️";
	  if (nom.includes("pulsation")) return "❤️‍🩹";
	  if (nom.includes("baillement")) return "🥱";
	  if (nom.includes("garou")) return "🎤";
	  if (nom.includes("pleure")) return "😢";
	  if (nom.includes("pas")) return "👣";
	  if (nom.includes("révélation")) return "😲";
	  if (nom.includes("transformation")) return "🧬";
      if (nom.includes("village s'endort")) return "🌙";
      if (nom.includes("village se reveille") || nom.includes("réveille")) return "🌅";
      if (nom.includes("cupidon")) return "💘";
      if (nom.includes("flèche") || nom.includes("fleche")) return "🏹";
      if (nom.includes("amoureux")) return "💑";
      if (nom.includes("loups")) return "🐺";
      if (nom.includes("sorcière") || nom.includes("sorciere")) return "🧙‍♀️";
      if (nom.includes("voyante")) return "🔮";
      if (nom.includes("flûte") || nom.includes("flute")) return "🎵";
      if (nom.includes("infect")) return "🦠";
      if (nom.includes("pet")) return "💨";
      if (nom.includes("chasseur")) return "🎯";
      if (nom.includes("ange")) return "😇";
      if (nom.includes("chien loup")) return "🐕";
      if (nom.includes("mort")) return "💀";
      if (nom.includes("corbeau")) return "🐦";
      return "🎶";
    }

    const card = document.createElement('div');
    card.className = "sound-card";
    card.innerHTML = `<div class="sound-name">${getSoundEmoji(s.nom)} ${s.nom}</div>`;

    card.onclick = function() {
      stopAllSoundsExcept(audios);

      if (s.state === 'stopped') {
        const audio = audios[s.playIdx];
        audio.currentTime = 0;
        audio.play().catch(()=>{});
        card.classList.add('active');
        s.state = 'playing';
      } else {
        // Arrêt du son en cours
        audios[s.playIdx].pause();
        audios[s.playIdx].currentTime = 0;
        card.classList.remove('active');
        s.state = 'stopped';

        // Passe au suivant pour le prochain clic
        s.playIdx = (s.playIdx + 1) % audios.length;
        soundPlayIndex[s.nom] = s.playIdx;
        localStorage.setItem("soundPlayIndex", JSON.stringify(soundPlayIndex));
      }
    };

    // 🔁 Quand le son se termine, on passe automatiquement au suivant pour la prochaine fois
    audios.forEach(audio => {
      audio.onended = () => {
        s.state = 'stopped';
        card.classList.remove('active');
        s.playIdx = (s.playIdx + 1) % audios.length;
        soundPlayIndex[s.nom] = s.playIdx;
        localStorage.setItem("soundPlayIndex", JSON.stringify(soundPlayIndex));
      };
    });

    grid.appendChild(card);
  });
}

  // Enlève le style "actif" sur toutes les cartes son

    } catch(e){}
  }
}


// 🔊 Lecture automatique selon le texte de narration
function playAutoSoundForNarration(txt) {
  const t = txt.toLowerCase();
  let cible = null;

  if (t.includes("village s'endort") || t.includes("1ère nuit") || t.includes("le village s’endort")) cible = "Village s'endort";
  else if (t.includes("village se réveille") || t.includes("le village se réveille")) cible = "Village se réveille";
  else if (t.includes("🇲🇫")) cible = "Election Maire";
  else if (t.includes("👑")) cible = "Applaudissements";
  else if (t.includes("💘")) cible = "Cupidon";
  else if (t.includes("pioche")) cible = "Got";
  else if (t.includes("💞")) cible = "Amoureux";
  else if (t.includes("👀")) cible = "Voyante";
  else if (t.includes("🐺") || t.includes("loup garou")) cible = "Loups-Garous";
  else if (t.includes("🧪")) cible = "Sorcière";
  else if (t.includes("👧")) cible = "Petite Fille";
  else if (t.includes("🦠")) cible = "Infect Père";
  else if (t.includes("🏹")) cible = "Cupidon tire flèche";
  else if (t.includes("🔫")) cible = "Chasseur";
  else if (t.includes("🧓")) cible = "Ancien";
  else if (t.includes("🐕")) cible = "Chien Loup";
  else if (t.includes("💀")) cible = "Mort";

  // 🎵 Cas spécial : Joueur de Flûte
  if (t.includes("joueur de flûte") || t.includes("flute")) {
    // Si un son de flûte joue déjà, ne rien faire
    if (!window.audioFluteLoop || window.audioFluteLoop.paused) {
      const flute = new Audio("son/Flute1.mp3");
      flute.loop = true;
      flute.volume = 0.4;
      flute.play().catch(()=>{});
      window.audioFluteLoop = flute;
    }
    return; // on ne coupe pas les autres sons, on sort ici
  }

  // 🔇 Si on lit "ferme les yeux" → arrêter la flûte
  if ((t.includes("rendormez")) && window.audioFluteLoop) {
    window.audioFluteLoop.pause();
    window.audioFluteLoop = null;
  }

  if (!cible) return;

  const found = sounds.find(s => s.nom.toLowerCase() === cible.toLowerCase());
  if (!found) return;

  stopAllSoundsExcept(); // coupe le reste avant lecture

  if (!window.autoAudio) {
    window.autoAudio = new Audio();
    window.autoAudio.volume = 0.9;
  }

  window.autoAudio.src = found.musiques[found.playIdx];
  window.autoAudio.currentTime = 0;
  window.autoAudio.play().catch(()=>{});

  found.playIdx = (found.playIdx + 1) % found.musiques.length;
  soundPlayIndex[found.nom] = found.playIdx;
  localStorage.setItem("soundPlayIndex", JSON.stringify(soundPlayIndex));
}

	// --- Normalise les rôles pour comparer sans accent ni casse ---
function normalizeRole(str) {
  return (str || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "") // enlève accents
    .replace(/[^a-z0-9]+/g, " ")     // remplace les tirets / espaces multiples
    .trim();
}

// --- Vérifie s’il reste un joueur vivant pour un rôle donné ---
function hasAliveForRole(roleName) {
  if (!roleName) return true; // aucun rôle associé = toujours visible
  const norm = normalizeRole(roleName);
  return joueurs.some(
    (j, i) =>
      j.vivant &&
      i !== narrateurIdx &&
      normalizeRole(j.role) === norm
  );
}

function renderNarration() {
  const narrText = document.getElementById("narrText");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnRappeler = document.getElementById("btnRappeler");

  const total = narration.length;
  let safety = 0;

  const fluteMort = !hasAliveForRole("Joueur de Flûte");

// 🔁 Recherche du prochain texte à afficher
while (narrIdx < total && safety < total) {
  const step = narration[narrIdx];
  const txtLower = (step.txt || "").toLowerCase();

  // 👉 Rôle concerné par ce step ?
  const hasRole = !!step.role;

  // 👉 Est-ce encore la Nuit 1 ? (tout ce qui est avant le 1er "Le village se réveille")
  const isFirstNight = narrIdx <= END_N1_IDX;

  // 👉 Textes liés au Joueur de Flûte (pour ne pas rappeler si la Flûte est morte)
  const isFluteRelated =
    txtLower.includes("flûte") || txtLower.includes("flute") || txtLower.includes("charm");

  // ⚖️ Doit-on afficher ce step ?
  // Nuit 1 : on force l’affichage de TOUS les rôles (même si non attribués ou morts)
  // Nuits suivantes : on n’affiche un rôle que s’il reste au moins un joueur VIVANT pour ce rôle
  let skip = false;

  if (!isFirstNight && hasRole) {
    const aliveForRole = hasAliveForRole(step.role);
    if (!aliveForRole) skip = true;
  }

  // Cas particulier : si c’est un texte « Flûte » et que la Flûte est entièrement morte
  if (!isFirstNight && isFluteRelated && !hasAliveForRole("Joueur de Flûte")) {
    skip = true;
  }

  if (skip) {
    narrIdx++;
    safety++;
    continue;
  }

  break; // ✅ on affiche ce step
}



  if (narrIdx >= total) narrIdx = 0;

  const current = narration[narrIdx];

  // 🧠 Enregistre cette étape dans l’historique (si nouvelle)
  if (narrHistory[narrHistory.length - 1] !== narrIdx) {
    narrHistory.push(narrIdx);
  }

  // 📝 Affiche la narration courante
  narrText.innerHTML = current.txt.replace(/\n/g, "<br>");

 // 🌙 Si c’est la phase de la Voyante, affiche les boutons uniquement au réveil
const roleChoiceContainerId = "roleChoiceContainer";
document.getElementById(roleChoiceContainerId)?.remove();

// ✅ On vérifie le texte courant
const lowerTxt = current.txt.toLowerCase();
const isReveilVoyante =
  lowerTxt.includes("voyante, réveille-toi") ||
  lowerTxt.includes("voyante, reveille-toi");
const isFinVoyante =
  lowerTxt.includes("voyante, ferme les yeux") ||
  lowerTxt.includes("voyante, referme les yeux");

// 🎴 Affiche les cartes seulement si réveil
if (isReveilVoyante) {
  const container = document.createElement("div");
  container.id = roleChoiceContainerId;
  ROLE_CARDS.forEach(r => {
    const btn = document.createElement("button");
    btn.className = "role-choice-btn";
    btn.textContent = `${r.emoji} ${r.nom}`;
    btn.onclick = () => showRoleCard(r.nom);
    container.appendChild(btn);
  });
  narrText.insertAdjacentElement("afterend", container);
}

// 💤 Si la Voyante se rendort → on s'assure que tout disparaît
if (isFinVoyante) {
  document.getElementById(roleChoiceContainerId)?.remove();
  const overlay = document.getElementById("roleCardOverlay");
  overlay?.classList.remove("active");
}


    playAutoSoundForNarration(current.txt);
  btnPrev.disabled = (narrHistory.length <= 1);
  btnRappeler.classList.add("hidden");
  btnNext.classList.remove("hidden");
  

  // 🔙 Bouton RETOUR — revient à l’étape précédente de l’historique
  btnPrev.onclick = function () {
  stopAllSoundsExcept(); // 🛑 coupe le son en cours
  if (narrHistory.length > 1) {
    narrHistory.pop();
    narrIdx = narrHistory[narrHistory.length - 1];
    renderNarration();
  }
};


  // 🔜 Bouton SUIVANT — avance normalement
btnNext.onclick = function () {
  stopAllSoundsExcept(); // 🛑 coupe le son en cours
  narrIdx++;
  if (narrIdx >= total) narrIdx = 0;
  renderNarration();
};

}

document.addEventListener("DOMContentLoaded", () => {
  const muteBtn = document.getElementById("muteButton");
  if (!muteBtn) return;

  let isMuted = JSON.parse(localStorage.getItem("muteState") || "false");

  // 🧩 applique immédiatement le bon état
  function applyMuteState() {
    document.querySelectorAll("audio").forEach(a => a.muted = isMuted);
    if (window.autoAudio) window.autoAudio.muted = isMuted;
    muteBtn.textContent = isMuted ? "🔇" : "🔊";
    muteBtn.classList.toggle("muted", isMuted);
  }

  // 🖱️ toggle au clic
  muteBtn.addEventListener("click", () => {
    isMuted = !isMuted;
    localStorage.setItem("muteState", JSON.stringify(isMuted));
    applyMuteState();
  });

  applyMuteState();

  // 👁️ vérifie en continu la page visible (toutes les 0,3 s)
  setInterval(() => {
    const pageSons = document.getElementById("pageSons");
    if (!pageSons) return;
    if (!pageSons.classList.contains("hidden")) {
      muteBtn.classList.remove("hidden");
    } else {
      muteBtn.classList.add("hidden");
    }
  }, 300);
});
